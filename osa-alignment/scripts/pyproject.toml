[project]
name = "osa-alignment-evaluator"
version = "0.1.0"
description = "Concentric-boundary geometry and hole-intensity metrics for OSA images"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.15,<2",
    "pillow>=11,<13",
    "scikit-image>=0.25,<0.27",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
analysis = ["matplotlib>=3.9,<4", "pytest>=8,<10"]
